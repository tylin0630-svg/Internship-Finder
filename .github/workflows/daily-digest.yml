name: Daily Chemistry Internship Digest

on:
  schedule:
    # 8:00 AM America/New_York.
    # GitHub Actions cron is UTC and has no DST awareness, so we fire at
    # both possible UTC offsets; find_internships.py checks the actual
    # New York time and no-ops (no email sent) on the wrong one.
    - cron: "0 12 * * *"  # 8am EDT (roughly Mar-Nov)
    - cron: "0 13 * * *"  # 8am EST (roughly Nov-Mar)
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python find_internships.py

      - name: Commit updated seen-jobs state (if changed)
        run: |
          git config user.name "internship-bot"
          git config user.email "actions@github.com"
          git add data/seen_jobs.json
          git diff --quiet --cached || git commit -m "Update seen jobs list [skip ci]"
          git push
